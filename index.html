<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Our Adventures</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="light">

    <!-- Top Bar -->
    <header class="top-bar">

        <h1>❤️ Our Adventures</h1>

        <div class="top-buttons">

            <button id="themeToggle">
                🌙
            </button>

        </div>

    </header>

    <!-- Search -->

    <section class="search-section">

        <input
            type="text"
            id="search"
            placeholder="Search dates, tags, locations..."
        >

<button id="filterButton">
    ☰ Filter
</button>


<!-- FILTER PANEL -->

<div id="filterPanel" class="hidden">

    <h2>Filters</h2>


    <h3>Category</h3>

    <div id="categoryFilters">
        <!-- Categories appear here -->
    </div>



    <h3>Tags</h3>

    <div id="tagFilters">
        <!-- Tags appear here -->
    </div>



    <h3>Price</h3>

    <label>
        <input type="checkbox">
        $
    </label>

    <label>
        <input type="checkbox">
        $$
    </label>

    <label>
        <input type="checkbox">
        $$$
    </label>



    <h3>Spoons</h3>

    <label>
        <input type="checkbox">
        🥄
    </label>

    <label>
        <input type="checkbox">
        🥄🥄
    </label>

    <label>
        <input type="checkbox">
        🥄🥄🥄+
    </label>


    <button id="closeFilter">
        Close
    </button>


</div>

    </section>

    <!-- Pinterest Grid -->

    <main id="homePage">
<div id="cardContainer">

</div>

    </main>

    <!-- DETAILS PAGE -->

<section id="detailsPage" class="page hidden">

    <button id="backButton">
        ← Back
    </button>

    <div id="detailsContainer">

    </div>

</section>

  <!-- DETAILS PAGE -->

<section id="detailsPage" class="page hidden">

    <button id="backButton">
        ← Back
    </button>

    <div id="detailsContainer">

    </div>

</section>

<!-- SURPRISE PAGE -->

<section id="surprisePage" class="page hidden">

    <h2>
        🎲 Surprise Me
    </h2>


    <div id="surpriseContainer">

    </div>


    <button id="randomButton">

        Pick A Date

    </button>


</section>
<!-- ADD PAGE -->

<section id="addPage" class="page hidden">

    <h2>➕ Add Idea</h2>


    <input placeholder="Idea Name">


    <input placeholder="Category">


    <textarea placeholder="Description"></textarea>


    <button>
        Save Idea
    </button>


</section>
    <!-- Bottom Navigation -->

    <nav class="bottom-nav">

        <button class="navButton" data-page="home">
            🏠
            <span>Home</span>
        </button>


        <button class="navButton" data-page="wishlist">
            ❤️
            <span>Wishlist</span>
        </button>

        <button class="navButton" data-page="completed">
            ✅
            <span>Completed</span>
        </button>
        
        <button class="navButton" data-page="surprise">

        🎲
        <span>Surprise</span>

        </button>    

        <button class="navButton" data-page="add">
            ➕
            <span>Add</span>
        </button>

    </nav>

    <script src="script.js"></script>

</body>
</html>
